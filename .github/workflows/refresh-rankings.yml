# Free alternative to Render Cron: refresh rankings from Drive into Supabase.
# Runs 4× daily. Requires repo secret DATABASE_URL (same Session pooler URI as Render).

name: Refresh rankings

on:
  schedule:
    # 04:00, 10:00, 16:00, 22:00 UTC ≈ 12am / 6am / 12pm / 6pm US Eastern (EDT)
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Download Drive copies and import to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/scheduled_refresh.py
